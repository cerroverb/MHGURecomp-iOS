name: iOS release

# When morerokk/MHGURecomp has a release newer than this fork's latest, merge its tag into ios, translate the game code,
# build the IPA on a macOS runner and publish MHGURecomp-iOS.<tag>.<revision>.ipa as a release.
# The game's exefs (main, sdk) comes from the private repo cerroverb/mhgu-private-assets (secret ASSETS_DEPLOY_KEY).
# A merge conflict is resolved by Claude Code when the secret CLAUDE_CODE_OAUTH_TOKEN is set; otherwise the run fails.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      revision:
        description: "Fork-only update of the same upstream release: 2, 3, ... (1: a new upstream release)"
        default: "1"
      publish:
        description: "Push the merge and publish the release (off: build and test only)"
        type: boolean
        default: true
      draft:
        description: "Publish as a draft (not seen by the updater)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fork-release
  cancel-in-progress: false

env:
  UPSTREAM: morerokk/MHGURecomp
  BRANCH: ios
  MOLTENVK_VER: v1.3.0
  SDL3_TAG: release-3.4.18
  SHADERC_TAG: v2026.4
  FFMPEG_TAG: n9.0.2
  IOS_MIN: "15.0"

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      up: ${{ steps.v.outputs.up }}
      go: ${{ steps.v.outputs.go }}
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ inputs.revision || '1' }}
          PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
        run: |
          up=$(gh api repos/$UPSTREAM/releases/latest --jq .tag_name)
          ours=$(gh api repos/$GITHUB_REPOSITORY/releases/latest --jq .tag_name 2>/dev/null || echo none)
          echo "upstream $up, this fork $ours"
          go=true
          if [ "${ours%.*}" = "$up" ] && [ "$REVISION" = 1 ] && [ "$PUBLISH" = true ]; then go=false; echo "up to date"; fi
          echo "up=$up" >> "$GITHUB_OUTPUT"; echo "go=$go" >> "$GITHUB_OUTPUT"

  release:
    needs: check
    if: needs.check.outputs.go == 'true'
    runs-on: macos-15
    timeout-minutes: 360
    env:
      UP: ${{ needs.check.outputs.up }}
      REVISION: ${{ inputs.revision || '1' }}
      PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
      DRAFT: ${{ inputs.draft || false }}
      HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0

      - name: Merge the upstream release
        id: merge
        run: |
          git config user.name cerroverb
          git config user.email cerroverb@users.noreply.github.com
          git fetch -q --tags "https://github.com/$UPSTREAM.git"
          if git merge-base --is-ancestor "$UP" HEAD; then echo "$UP is already merged"; exit 0; fi
          if git merge -q --no-edit -m "Merge $UP" "$UP"; then exit 0; fi
          files=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
          echo "conflicts in: $files"
          echo "files=$files" >> "$GITHUB_OUTPUT"
          [ "$HAS_CLAUDE" = true ] || { echo "::error::Merge conflict in $files and no CLAUDE_CODE_OAUTH_TOKEN"; exit 1; }

      - name: Resolve the conflicts (Claude Code)
        if: steps.merge.outputs.files != ''
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            This repository is a fork of morerokk/MHGURecomp, stopped in a merge of upstream tag ${{ env.UP }} with conflicts in: ${{ steps.merge.outputs.files }}
            Resolve only those conflicts with the Edit tool. Keep every platform-specific change of this fork and every upstream change: read both sides with git log and git show to learn why each exists. If upstream restructured the code, carry the fork's change over into the new structure. Add no new behaviour, and change nothing outside the conflicts. Keep each file's line endings exactly (some files use CRLF). Remove all conflict markers. Do not stage or commit. If a conflict cannot be resolved with confidence, leave its markers in place and say why.
          claude_args: >-
            --allowedTools "Read,Edit,Grep,Glob,Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(git status:*),Bash(git blame:*)"
            --disallowedTools "Bash(git push:*),Bash(git commit:*),Bash(git add:*),Bash(curl:*),Bash(gh:*)"

      - name: Check and commit the resolved merge
        if: steps.merge.outputs.files != ''
        env:
          FILES: ${{ steps.merge.outputs.files }}
        run: |
          left=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
          [ "$left" = "$FILES" ] || { echo "::error::Unexpected files in conflict: $left"; exit 1; }
          if grep -nE '^(<<<<<<<|=======$|>>>>>>>)' $FILES; then echo "::error::Conflict markers left"; exit 1; fi
          git add $FILES && git commit -q --no-edit

      - name: Private build inputs
        env:
          KEY: ${{ secrets.ASSETS_DEPLOY_KEY }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/assets_key"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/assets_key"
          GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/assets_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            git clone -q --depth 1 git@github.com:cerroverb/mhgu-private-assets.git "$RUNNER_TEMP/assets"
          rm -f "$RUNNER_TEMP/assets_key"

      - name: Python
        run: |
          python3 -m venv tools/venv
          tools/venv/bin/pip install -q -r tools/requirements.txt

      - name: Game code
        run: |
          A=$RUNNER_TEMP/assets
          rm -rf generated
          (cd tools && ../tools/venv/bin/python gen.py sdk "$A/exefs/sdk" 0x02400000 ../generated/sdk --hle ../runtime/hle/hle_symbols.txt &&
           ../tools/venv/bin/python gen.py main "$A/exefs/main" 0x00200000 ../generated/main)

      # Each group of libraries has a cache of its own, saved as soon as it is built: a later failure doesn't build it again.
      - name: Restore MoltenVK, SDL3, shaderc
        id: cache-libs
        uses: actions/cache/restore@v4
        with:
          path: deps-libs
          key: ios-libs-macos-15-${{ env.MOLTENVK_VER }}-${{ env.SDL3_TAG }}-${{ env.SHADERC_TAG }}-${{ env.IOS_MIN }}

      - name: Build MoltenVK, SDL3, shaderc
        if: steps.cache-libs.outputs.cache-hit != 'true'
        run: |
          mkdir -p deps-libs/lib deps-libs/include
          NCPU=$(sysctl -n hw.ncpu)

          echo "=== 1. Downloading MoltenVK for iOS ==="
          curl -fL -o MoltenVK-ios.tar https://github.com/KhronosGroup/MoltenVK/releases/download/$MOLTENVK_VER/MoltenVK-ios.tar
          tar -xf MoltenVK-ios.tar
          cp MoltenVK/MoltenVK/static/MoltenVK.xcframework/ios-arm64/libMoltenVK.a deps-libs/lib/libMoltenVK.a
          cp -r MoltenVK/MoltenVK/include/* deps-libs/include/
          rm -rf MoltenVK MoltenVK-ios.tar

          echo "=== 2. Building SDL3 for iOS ==="
          git clone --depth 1 --branch $SDL3_TAG https://github.com/libsdl-org/SDL.git sdl3-src
          cmake -S sdl3-src -B sdl3-build \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=$IOS_MIN \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$PWD/sdl3-install \
            -DSDL_STATIC=ON \
            -DSDL_SHARED=OFF \
            -DSDL_TESTS=OFF \
            -DSDL_TEST_LIBRARY=OFF
          cmake --build sdl3-build --target install --config Release -j$NCPU
          cp sdl3-install/lib/libSDL3.a deps-libs/lib/libSDL3.a
          cp -r sdl3-install/include/* deps-libs/include/
          rm -rf sdl3-src sdl3-build sdl3-install

          echo "=== 3. Building shaderc for iOS ==="
          git clone --depth 1 --branch $SHADERC_TAG https://github.com/google/shaderc.git shaderc-src
          cd shaderc-src
          python3 utils/git-sync-deps
          cmake -B build \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=$IOS_MIN \
            -DCMAKE_BUILD_TYPE=Release \
            -DSHADERC_SKIP_TESTS=ON \
            -DSHADERC_SKIP_EXAMPLES=ON \
            -DSHADERC_SKIP_COPYRIGHT_CHECK=ON
          cmake --build build --target shaderc_combined --config Release -j$NCPU
          find build -name "libshaderc_combined.a" -exec cp {} ../deps-libs/lib/libshaderc_combined.a \;
          cp -r libshaderc/include/* ../deps-libs/include/
          cd ..
          rm -rf shaderc-src
          ls -lh deps-libs/lib/

      - name: Save MoltenVK, SDL3, shaderc
        if: steps.cache-libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: deps-libs
          key: ios-libs-macos-15-${{ env.MOLTENVK_VER }}-${{ env.SDL3_TAG }}-${{ env.SHADERC_TAG }}-${{ env.IOS_MIN }}

      - name: Restore FFmpeg
        id: cache-ffmpeg
        uses: actions/cache/restore@v4
        with:
          path: deps-ffmpeg
          key: ios-ffmpeg-macos-15-${{ env.FFMPEG_TAG }}-${{ env.IOS_MIN }}

      # (the movies' MP4s, H.264 and AAC: the Makefile's FFMPEG_CONF, cross-compiled as android/android.mk does)
      - name: Build FFmpeg
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          NCPU=$(sysctl -n hw.ncpu)
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          FLAGS="-target arm64-apple-ios$IOS_MIN -isysroot $SDK"
          git clone --depth 1 --branch $FFMPEG_TAG https://github.com/FFmpeg/FFmpeg.git ffmpeg-src
          cd ffmpeg-src
          ./configure --prefix=$GITHUB_WORKSPACE/deps-ffmpeg \
            --disable-everything --disable-programs --disable-doc --disable-network --disable-autodetect \
            --disable-debug --disable-avdevice --disable-avfilter --disable-swscale --disable-swresample \
            --enable-static --disable-shared --enable-protocol=file --enable-demuxer=mov \
            --enable-parser=h264,aac --enable-decoder=h264,aac \
            --enable-cross-compile --target-os=darwin --arch=aarch64 --disable-asm --enable-pic \
            --cc="xcrun --sdk iphoneos clang" --cxx="xcrun --sdk iphoneos clang++" \
            --extra-cflags="$FLAGS" --extra-ldflags="$FLAGS" --host-cc=clang \
            || { tail -40 ffbuild/config.log; exit 1; }
          make -j$NCPU install
          cd ..
          rm -rf ffmpeg-src
          ls -lh deps-ffmpeg/lib/

      - name: Save FFmpeg
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: deps-ffmpeg
          key: ios-ffmpeg-macos-15-${{ env.FFMPEG_TAG }}-${{ env.IOS_MIN }}

      - name: Collect the libraries
        run: |
          mkdir -p deps
          cp -R deps-libs/* deps/
          cp -R deps-ffmpeg/lib deps-ffmpeg/include deps/

      # The game code's objects: their sources are newer after a checkout, so they are touched once restored.
      - name: Restore game code objects
        id: cache-gen
        uses: actions/cache/restore@v4
        with:
          path: obj/gen
          key: ios-gen-${{ hashFiles('generated/**', 'runtime/cpu.h', 'runtime/vfp.h', 'runtime/neon_rt.h', 'runtime/gamelib.h') }}

      - name: Build MHGURecomp iOS binary
        run: |
          [ -d obj/gen ] && find obj/gen -name '*.o' -exec touch {} +
          NCPU=$(sysctl -n hw.ncpu)
          make -j$NCPU DEPS=deps VERSION="$UP.$REVISION-ios"
          file build/MHGURecomp

      - name: Save game code objects
        if: always() && steps.cache-gen.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: obj/gen
          key: ios-gen-${{ hashFiles('generated/**', 'runtime/cpu.h', 'runtime/vfp.h', 'runtime/neon_rt.h', 'runtime/gamelib.h') }}

      - name: Package .app and .ipa bundle
        run: |
          APP_DIR="Payload/MHGURecomp.app"
          mkdir -p "$APP_DIR"

          # Copy main executable
          cp build/MHGURecomp "$APP_DIR/MHGURecomp"

          # Copy plists, icons and the recorded pipelines (runtime/nvn/vulkan/exec.c plist_load: beside the executable)
          cp ios/Info.plist "$APP_DIR/Info.plist"
          cp ios/Entitlements.plist "$APP_DIR/Entitlements.plist"
          cp ios/Icon.png "$APP_DIR/Icon.png"
          cp ios/Icon.png "$APP_DIR/AppIcon60x60@2x.png"
          cp ios/Icon.png "$APP_DIR/AppIcon76x76@2x~ipad.png"
          cp extras/pipelines.list "$APP_DIR/pipelines.list"

          # Strip debug symbols to optimize size
          xcrun strip -S "$APP_DIR/MHGURecomp"

          # Clear extended attributes before signing
          xattr -cr "$APP_DIR" 2>/dev/null || true

          # Ad-hoc sign ONLY the inner executable with increased-memory-limit entitlement
          # (Sideloaders read entitlements from the binary and re-sign the whole .app bundle on-device.)
          codesign --force --sign - --entitlements ios/Entitlements.plist "$APP_DIR/MHGURecomp"

          # Verify binary signature and entitlements
          codesign -dvvv --entitlements :- "$APP_DIR/MHGURecomp"

          # Remove bundle-level _CodeSignature so sideloaders can cleanly sign on-device
          rm -rf "$APP_DIR/_CodeSignature"

          # Create IPA archive
          zip -r9 MHGURecomp.ipa Payload
          ls -lh MHGURecomp.ipa

      - name: Publish
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$UP.$REVISION
          file="$RUNNER_TEMP/MHGURecomp-iOS.$tag.ipa"
          cp MHGURecomp.ipa "$file"
          git push -q origin "HEAD:$BRANCH"
          git rev-parse -q --verify "refs/tags/$tag" >/dev/null || git tag -a "$tag" -m "MHGURecomp $tag for iOS"
          git push -q origin "refs/tags/$tag"
          printf 'MHGU Recomp %s for iOS, merged from upstream %s and built automatically.\n\nSideload the IPA and put your own dump of MHGU 1.4.0 in `MHGURecomp/data`. See the README.\n' "$tag" "$UP" > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" "$file" --verify-tag --title "MHGU Recomp $tag for iOS" \
            --notes-file "$RUNNER_TEMP/notes.md" $([ "$DRAFT" = true ] && echo --draft)
          digest=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$tag\") | .assets[0].digest")
          [ "$digest" = "sha256:$(shasum -a 256 "$file" | cut -d' ' -f1)" ] || { echo "::error::uploaded digest $digest differs"; exit 1; }
          echo "published $tag" >> "$GITHUB_STEP_SUMMARY"
